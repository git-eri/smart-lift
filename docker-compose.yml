services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    user: "65532:65532"
    command:
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --api.dashboard=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entryPoints.web.address=:8080
    ports:
      - "${SMARTLIFT_BIND_ADDRESS:-127.0.0.1}:${SMARTLIFT_PORT:-8080}:8080"
    volumes:
      - ./deploy/traefik.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: &bounded_logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    build: { context: ./frontend }
    image: smart-lift-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded_logs

  backend:
    build: { context: ./backend }
    image: smart-lift-backend
    restart: unless-stopped
    # Match these to the host owner of ./data on Linux (see .env.example).
    user: "${SMARTLIFT_UID:-1000}:${SMARTLIFT_GID:-1000}"
    environment:
      SMARTLIFT_DATA_DIR: /code/app/data
      SMARTLIFT_CONTROLLER_TOKEN: ${SMARTLIFT_CONTROLLER_TOKEN:-}
      SMARTLIFT_ALLOWED_ORIGINS: ${SMARTLIFT_ALLOWED_ORIGINS:-}
    volumes:
      - ./binaries:/code/app/binaries:ro
      - ./data:/code/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 10s
    logging: *bounded_logs
